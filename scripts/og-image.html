<!DOCTYPE html>
<!--
  Source for public/og-image.png, the 1200×630 image shown when the site is
  shared on LinkedIn, Slack etc. To regenerate after editing, from the repo root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
    --screenshot="$PWD/public/og-image.png" "file://$PWD/scripts/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&family=Inter:wght@500&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
	html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
	body {
		position: relative;
		background-color: #f4c542;
		font-family: 'Inter', sans-serif;
	}
	.panel {
		position: absolute;
		inset: 0;
		background-color: #1c2e5a;
		background-image: radial-gradient(rgba(244, 197, 66, 0.22) 1.6px, transparent 1.6px);
		background-size: 26px 26px;
		clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%);
		padding: 72px 80px;
		box-sizing: border-box;
		color: #fbf7ee;
	}
	.badge {
		position: absolute;
		top: 72px;
		right: 80px;
		width: 196px;
		height: 196px;
		background: #f4c542;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.badge img { width: 164px; }
	.eyebrow {
		font-family: 'JetBrains Mono', monospace;
		font-size: 24px;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		color: #f4c542;
		margin-bottom: 28px;
	}
	h1 {
		margin: 0;
		max-width: 820px;
		font-family: 'Josefin Sans', sans-serif;
		font-weight: 700;
		font-size: 80px;
		line-height: 1.02;
		letter-spacing: -0.01em;
	}
	.highlight { color: #f4c542; }
	.lede {
		margin-top: 30px;
		max-width: 860px;
		font-size: 27px;
		line-height: 1.45;
		color: #dce2f0;
	}
	.url {
		position: absolute;
		right: 80px;
		bottom: 34px;
		font-family: 'JetBrains Mono', monospace;
		font-size: 26px;
		color: #1c2e5a;
		letter-spacing: 0.02em;
	}
</style>
</head>
<body>
	<div class="panel">
		<div class="eyebrow">&gt; Online · Global · Community-run</div>
		<h1>Practical skills for women <span class="highlight">rising</span> in tech.</h1>
		<div class="lede">Hands-on sessions in coding, architecture and career growth.</div>
		<div class="badge"><img src="../src/media/logodark.png" alt="" /></div>
	</div>
	<div class="url">techriserswomen.com</div>
</body>
</html>
